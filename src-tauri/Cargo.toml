[package]
name = "quarterdeck"
version = "0.1.0"
edition = "2021"

[lib]
name = "quarterdeck_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"        # PTY コア
base64 = "0.22"             # PTY 出力のイベント送信
which = "6"                 # pwsh / powershell 解決
tauri-plugin-updater = "2"  # Phase 4 配布（NSIS + 自動更新）
tauri-plugin-opener = "2"   # HTML プレビューを既定ブラウザで開く（ADR-0006）
notify-debouncer-mini = "0.7" # ファイルツリー自動更新（FS 監視 + デバウンス。notify 再エクスポート同梱）
percent-encoding = "2"      # pdf:// プロトコルの URL パス復元（ADR-0005）

[dev-dependencies]
tempfile = "3" # fs_scope のスコープ強制テスト用
