[package]
name = "quarterdeck"
version = "0.1.0"
edition = "2021"

[lib]
name = "quarterdeck_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9" # PTY コア
base64 = "0.22"      # PTY 出力のイベント送信
which = "6"          # pwsh / powershell 解決

# Phase 4 配布で追加予定:
#   tauri-plugin-updater = "2"
